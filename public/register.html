<!DOCTYPE html>
<html lang="id-id" class="light" style="color-scheme: light;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Daftar - Nuvora Store</title>
  <link rel="shortcut icon" href="https://client-cdn.bangjeff.com/favicon-05318000.webp.webp?v=3">
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            'card-foreground': 'hsl(var(--card-foreground))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            'secondary-foreground': 'hsl(var(--secondary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            'accent-foreground': 'hsl(var(--accent-foreground))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
          },
          fontFamily: {
            sans: ['IBM Plex Sans Condensed', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --popular-background: 263.92 100% 30%;
      --popular-foreground: 0 0% 100%;
      --background: 260.87 70.31% 55.1%;
      --foreground: 0 0% 100%;
      --card: 306.67 20% 17.65%;
      --card-foreground: 0 0% 100%;
      --primary: 198.99 63.47% 57.06%;
      --primary-foreground: 0 0% 96.08%;
      --secondary: 261.72 47.54% 23.92%;
      --secondary-foreground: 0 0% 100%;
      --muted: 263.54 67.52% 77.06%;
      --muted-foreground: 0 0% 98.04%;
      --accent: 198.11 30.29% 34.31%;
      --accent-foreground: 0 0% 100%;
      --border: 260.74 75.7% 79.02%;
      --input: 276.32 15.2% 50.98%;
      --ring: 197.14 67.74% 69.61%;
      --radius: 0.5rem;
    }
    body {
      font-family: 'IBM Plex Sans Condensed', system-ui, sans-serif;
      background: linear-gradient(180deg, hsl(260.87 70.31% 55.1%) 0%, hsl(261.72 47.54% 23.92%) 100%);
      background-attachment: fixed;
      color: hsl(0 0% 100%);
      min-height: 100vh;
      margin: 0;
    }
    * { border-color: hsl(var(--border) / 0.2); }
    .container { max-width: 1280px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col justify-between min-h-screen relative p-4 sm:p-6">

  <!-- Tombol Close (X) Pojok Kiri Atas -->
  <div class="w-full max-w-xl mx-auto mb-2">
    <a href="https://topup.nuvorastore.my.id" class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-black/30 hover:bg-black/50 text-white transition-colors border border-white/10">
      <i class="fa-solid fa-xmark text-lg"></i>
    </a>
  </div>

  <!-- Form Container -->
  <main class="flex-1 flex items-center justify-center py-4">
    <div class="w-full max-w-xl p-6 sm:p-8 rounded-3xl bg-secondary/90 border border-border/30 shadow-2xl backdrop-blur-sm">
      
      <!-- Judul & Subtitle -->
      <div class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-white">Daftar</h1>
        <p class="text-xs text-white/70 mt-1">Masukkan informasi pendaftaran yang valid.</p>
      </div>

      <!-- Form Pendaftaran -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
        
        <!-- Row 1: Nama Lengkap & Username -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1.5 text-white/90">Nama lengkap</label>
            <input type="text" id="fullName" required placeholder="Nama lengkap" class="w-full p-3 rounded-xl bg-black/30 border border-white/20 text-white placeholder:text-white/40 text-sm focus:outline-none focus:border-primary transition-colors">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5 text-white/90">Username</label>
            <input type="text" id="username" required placeholder="Username" class="w-full p-3 rounded-xl bg-black/30 border border-white/20 text-white placeholder:text-white/40 text-sm focus:outline-none focus:border-primary transition-colors">
          </div>
        </div>

        <!-- Row 2: Alamat Email -->
        <div>
          <label class="block text-xs font-semibold mb-1.5 text-white/90">Alamat email</label>
          <input type="email" id="email" required placeholder="Alamat email" class="w-full p-3 rounded-xl bg-black/30 border border-white/20 text-white placeholder:text-white/40 text-sm focus:outline-none focus:border-primary transition-colors">
        </div>

        <!-- Row 3: Nomor WhatsApp -->
        <div>
          <label class="block text-xs font-semibold mb-1.5 text-white/90">Nomor whatsapp</label>
          <div class="flex items-center rounded-xl bg-black/30 border border-white/20 overflow-hidden focus-within:border-primary transition-colors">
            <div class="flex items-center gap-1.5 px-3 py-3 border-r border-white/10 bg-white/5 text-xs text-white/90 font-medium select-none">
              <span class="text-base">🇮🇩</span>
              <span>+62</span>
            </div>
            <input type="tel" id="whatsapp" required placeholder="8123456789" class="w-full p-3 bg-transparent text-white placeholder:text-white/40 text-sm focus:outline-none">
          </div>
        </div>

        <!-- Row 4: Kata Sandi & Konfirmasi -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1.5 text-white/90">Kata sandi</label>
            <div class="relative">
              <input type="password" id="password" required placeholder="Kata sandi" class="w-full p-3 pr-10 rounded-xl bg-black/30 border border-white/20 text-white placeholder:text-white/40 text-sm focus:outline-none focus:border-primary transition-colors">
              <button type="button" onclick="togglePass('password', 'eyeIcon1')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40 hover:text-white text-xs">
                <i id="eyeIcon1" class="fa-solid fa-eye-slash"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5 text-white/90">Konfirmasi kata sandi</label>
            <div class="relative">
              <input type="password" id="confirmPassword" required placeholder="Konfirmasi kata sandi" class="w-full p-3 pr-10 rounded-xl bg-black/30 border border-white/20 text-white placeholder:text-white/40 text-sm focus:outline-none focus:border-primary transition-colors">
              <button type="button" onclick="togglePass('confirmPassword', 'eyeIcon2')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40 hover:text-white text-xs">
                <i id="eyeIcon2" class="fa-solid fa-eye-slash"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Checkbox Persetujuan -->
        <div class="pt-2">
          <label class="flex items-start space-x-2.5 cursor-pointer select-none">
            <input type="checkbox" id="termsCheck" required class="mt-0.5 w-4 h-4 rounded accent-primary bg-black/30 border-white/20 cursor-pointer">
            <span class="text-xs text-white/80 leading-relaxed">
              Saya setuju dengan <a href="#" class="text-primary hover:underline font-semibold">Syarat dan Ketentuan</a> dan <a href="#" class="text-primary hover:underline font-semibold">Kebijakan Pribadi</a>.
            </span>
          </label>
        </div>

        <!-- Button Submit -->
        <button type="submit" id="btnRegister" class="w-full p-3.5 rounded-xl bg-primary hover:bg-primary/80 text-primary-foreground font-bold text-sm tracking-wider transition-all duration-300 shadow-lg mt-2 flex items-center justify-center gap-2">
          <i class="fa-solid fa-user-plus text-xs"></i>
          <span>Daftar</span>
        </button>
      </form>

      <!-- Message Alert -->
      <div id="alertBox" class="mt-4 p-3 rounded-xl text-xs text-center hidden"></div>

      <!-- Sudah Punya Akun -->
      <p class="text-center text-xs mt-6 text-white/80">
        Sudah memiliki akun? 
        <a href="login.html" class="text-primary font-bold hover:underline">Masuk</a>
      </p>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6 text-xs text-white/50">
        <div class="flex-1 h-px bg-white/20"></div>
        <span>Atau lanjutkan dengan</span>
        <div class="flex-1 h-px bg-white/20"></div>
      </div>

      <!-- Button Google -->
      <button id="googleRegisterBtn" class="w-full flex items-center justify-center gap-3 p-3 rounded-xl bg-black/30 hover:bg-black/50 border border-white/20 text-white font-bold text-sm transition-all duration-300">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google</span>
      </button>

    </div>
  </main>

  <!-- Floating CS -->
  <div class="fixed bottom-4 right-4 z-50">
    <a href="https://wa.me/62882007580714" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-11 h-11 rounded-xl bg-primary text-primary-foreground shadow-lg hover:bg-primary/80 transition-all">
      <i class="fa-solid fa-headset text-lg"></i>
    </a>
  </div>

  <script>
    // Toggle Password Visibility
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    // Handler Form Register
    function handleRegister(e) {
      e.preventDefault();
      
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const whatsapp = document.getElementById('whatsapp').value.trim();
      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('btnRegister');

      if (pass !== confirmPass) {
        showAlert('Konfirmasi kata sandi tidak cocok.', 'error');
        return;
      }

      if (pass.length < 6) {
        showAlert('Kata sandi minimal 6 karakter.', 'error');
        return;
      }

      // Animasi Loading
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Memproses...</span>';

      // Simulasi Pendaftaran
      setTimeout(() => {
        showAlert('✓ Pendaftaran berhasil! Mengalihkan ke halaman masuk...', 'success');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      }, 1500);
    }

    function showAlert(msg, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'border-red-500/30', 'bg-green-500/20', 'text-green-300', 'border-green-500/30');
      
      if (type === 'error') {
        alertBox.classList.add('bg-red-500/20', 'text-red-300', 'border', 'border-red-500/30');
      } else {
        alertBox.classList.add('bg-green-500/20', 'text-green-300', 'border', 'border-green-500/30');
      }
      alertBox.textContent = msg;
    }

    document.getElementById('googleRegisterBtn').addEventListener('click', () => {
      showAlert('Fitur pendaftaran Google akan segera aktif.', 'error');
    });
  </script>
</body>
</html>
